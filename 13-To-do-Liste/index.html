<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Meine To-Do Liste</title>
</head>

<body>
  <div class="container">
    <h1>Meine To-Do Liste</h1>

    <ul class="todo-list">
        <li>
            <input type="checkbox" id="task1">
            <label for="task1">Tastatur kaufen</label>
            <ul class="sub-item">
                <li>
                    <a href="https://www.amazon.de/s?k=tastatur" target="_blank" rel="noopener noreferrer">Amazon Link</a>
                </li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="task2">
            <label for="task2">Report beenden</label>
            <ul class="sub-item">
                <li>
                    <a href="https://www.wikipedia.de" target="_blank" rel="noopener noreferrer">Wikipedia</a>
                </li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="task3">
            <label for="task3">Garantie vom Telefon überprüfen</label>
            <ul class="sub-item">
                <li>
                    <a href="https://www.mediamarkt.de" target="_blank" rel="noopener noreferrer">Media Markt</a>
                </li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="task4">
            <label for="task4">Prozessor Spezifikationen überprüfen</label>
            <ul class="sub-item">
                <li>
                    <a href="https://www.computerbase.de" target="_blank" rel="noopener noreferrer">Computerbase</a>
                </li>
            </ul>
        </li>
    </ul>
  </div>
</body>

</html>

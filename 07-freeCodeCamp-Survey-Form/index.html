<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <header>
      <h1 id="title">Survey Form</h1>
      <p id="description">We value your feedback. Please fill out this survey.</p>
    </header>

    <main>
        <form id="survey-form">
            <fieldset>
                <legend>Personal Information</legend>
                <label for="name" id="name-label">Name (required):</label>
                <input type="text" id="name" name="name" placeholder="Name, Lastname" required size="20">
                <br>
                <label for="email" id="email-label">Email (required):</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
                <br>
                <label for="number" id="number-label">Age (optional):</label>
                <input type="number" id="number" name="number" placeholder="Age" min="3" max="100">
                <br>
                <label for="dropdown">Which option best describes your current role?</label>
                <select id="dropdown" name="role">
                    <option value="student">Student</option>
                    <option value="full-time-job">Full Time Job</option>
                    <option value="part-time-job">Part Time Job</option>
                    <option value="freelancer">Freelancer</option>
                    <option value="other">Other</option>
                </select>
            </fieldset>
                <br>
            <fieldset>
                <legend>Survey Questions</legend>
                <label for="suggestion">Would you recommend us to a friend?</label><br>
                <input type="radio" id="suggestion" name="suggestion" value="yes" required>
                <label for="suggestion">Yes</label><br>
                <input type="radio" id="suggestion" name="suggestion" value="no" required>
                <label for="suggestion">No</label>
                <br>
                <br>
                <label for="improvement">What can we improve?</label>
                <br>
                <input type="checkbox" id="service" name="improvement" value="service">
                <label for="service">Service</label>
                <input type="checkbox" id="quality" name="improvement" value="quality">
                <label for="quality">Quality</label>
                <input type="checkbox" id="pricing" name="improvement" value="pricing">
                <label for="pricing">Pricing</label>
                <input type="checkbox" id="other" name="improvement" value="other">
                <label for="other">Other</label>
            </fieldset> 
                <br>      
                <label for="comments">Comments:</label>
                <br>
                <textarea id="comments" name="comments" placeholder="Enter your feedback here..." rows="5" cols="50"></textarea>
                <br>
                <br>
            <button type="submit" id="submit">Submit</button>

        </form>
    </main>
  </body>
</html>
